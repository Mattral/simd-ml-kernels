name: Wheels

# Builds wheels with cibuildwheel, installs each in a clean environment and
# runs selftest (pyproject.toml [tool.cibuildwheel]). Wheels are kept as
# workflow artifacts only: there is no publish step. (Running a wheel under
# Intel SDE is a local check: Intel's server refuses CI downloads.)
on:
  pull_request:
    branches: [main]
    paths: ["CMakeLists.txt", "pyproject.toml", "src/**", "python/**", ".github/workflows/wheels.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v2.23.3
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
