name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Primary: Linux GCC, AVX2, with OpenBLAS baseline ──────────────────────
  build-linux-gcc:
    name: Linux / GCC-12 / AVX2 + OpenBLAS
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++-12 \
            python3-dev python3-pip libopenblas-dev
          pip3 install scikit-build-core pybind11[global] numpy pytest scipy ml_dtypes

      - name: Clean stale build directory
        run: rm -rf build

      - name: Configure (Release, OpenBLAS enabled)
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DBENCH_OPENBLAS=ON

      - name: Build all targets
        run: cmake --build build --parallel

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Verify Python extension loads
        run: |
          pip3 install -e . --no-build-isolation -q
          python3 -c "
          import simd_ml_kernels, numpy as np
          A = np.random.randn(32, 32).astype(np.float32)
          C = simd_ml_kernels.sgemm(A, np.ascontiguousarray(A.T))
          x = np.random.randn(1024).astype(np.float32)
          y = simd_ml_kernels.gelu(x)
          y = simd_ml_kernels.layer_norm(x)
          print('Python extension smoke test: PASS')
          print(simd_ml_kernels.build_info())
          "

      - name: Self-test (every kernel vs float64; exits 1 on failure)
        run: python3 -m simd_ml_kernels selftest

      - name: Run Python tests
        run: pytest tests -v --tb=short


  # ─── OpenMP multi-threaded GEMM ─────────────────────────────────────────────
  build-openmp:
    name: Linux / GCC-12 / OpenMP GEMM
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++-12 \
            python3-dev python3-pip
          pip3 install "pybind11[global]>=2.11" numpy pytest scipy

      - name: Clean stale build directory
        run: rm -rf build_omp

      - name: Configure (OpenMP enabled)
        run: |
          cmake -S . -B build_omp -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DSIMD_ML_OPENMP=ON

      - name: Build
        run: cmake --build build_omp --parallel

      - name: C++ tests (with OpenMP)
        run: ctest --test-dir build_omp --output-on-failure

      # ctest ran the C++ GEMM suite at 1, 2 and 4 threads and the bitwise
      # 1-vs-2/3/4/8-thread checks. The Python tests then run on an OpenMP
      # install: TestGEMMThreads (1, 2, 4 threads) and the OMP_NUM_THREADS default.
      - name: Install the package with OpenMP
        run: |
          pip3 install scikit-build-core
          pip3 install . --no-build-isolation -q -C cmake.define.SIMD_ML_OPENMP=ON
          python3 -c "import simd_ml_kernels as s; i = s.build_info(); assert i['openmp'], i; print('threads', s.get_num_threads())"

      - name: Self-test and Python tests (OpenMP build)
        run: |
          python3 -m simd_ml_kernels selftest
          pytest tests -v --tb=short

  # ─── Secondary: Clang-15 with ASan/UBSan ───────────────────────────────────
  build-linux-asan:
    name: Linux / Clang-15 / ASan + UBSan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang-15 python3-dev python3-pip
          pip3 install pybind11[global] numpy

      - name: Clean stale build directory
        run: rm -rf build_asan

      - name: Configure (RelWithDebInfo, sanitizers enabled)
        run: |
          cmake -S . -B build_asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++-15 \
            -DSIMD_ML_SANITIZE=ON

      - name: Build
        run: cmake --build build_asan --parallel

      - name: Run ASan/UBSan tests
        run: |
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          ctest --test-dir build_asan --output-on-failure --parallel 1

  # ─── macOS: Apple Clang, scalar fallback path ───────────────────────────────
  build-macos:
    name: macOS / Apple Clang / Scalar fallback
    runs-on: macos-14   # Apple Silicon (ARM) — no AVX2; tests scalar fallback
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and pybind11
        run: brew install cmake ninja pybind11
      - name: Clean stale build directory
        run: rm -rf build
      - name: Configure (scalar build — no AVX2 flags)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSIMD_ML_ENABLE_X86=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test (scalar fallback path)
        run: ctest --test-dir build --output-on-failure
