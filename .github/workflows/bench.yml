name: Weekly Benchmark

on:
  schedule:
    - cron: '0 4 * * 0'   # Every Sunday at 4 AM UTC
  workflow_dispatch:        # Also runnable manually

jobs:
  bench:
    name: Statistical Benchmark
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # Pin g++-12 to match the rest of CI; avoid defaulting to GCC-11
          sudo apt-get install -y cmake ninja-build g++-12 \
            libopenblas-dev python3-dev python3-pip
          # Use pip pybind11[global] (>=2.11) rather than libpybind11-dev
          # (which pins an older system version and can conflict)
          pip3 install "pybind11[global]>=2.11" numpy scikit-build-core

      - name: Install the package
        run: pip3 install . --no-build-isolation

      - name: "Run benchmark (shared runner: for trend inspection only, never for claims)"
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python3 -m simd_ml_kernels selftest
          taskset -c 0 python3 -m simd_ml_kernels bench \
            --json ci-bench.json --label github-actions --core "CI runner vCPU 0" \
            --note "shared GitHub Actions runner, no frequency control"

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: ci-bench.json
          retention-days: 90
