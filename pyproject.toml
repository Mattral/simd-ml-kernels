[build-system]
requires = [
    "scikit-build-core>=0.6",
    "pybind11>=2.11",
    "cmake>=3.22",
    "ninja",
]
build-backend = "scikit_build_core.build"

# ─── Project metadata ──────────────────────────────────────────────────────────
[project]
name            = "simd-ml-kernels"
version         = "0.3.0rc1"   # keep in step with CMakeLists.txt (tests/test_cli.py checks)
description     = "Hand-vectorized AVX2 GEMM and ML activation microkernels with Python bindings"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies    = ["numpy>=1.24"]

[project.optional-dependencies]
# Minimum set for running the full test suite
dev   = ["pytest>=7.4", "scipy>=1.11", "torch; extra == 'torch'"]
# Additional tools for the Python benchmark with plots
bench = ["matplotlib>=3.7", "tabulate>=0.9"]
# Everything including optional extras
all   = ["pytest>=7.4", "scipy>=1.11", "matplotlib>=3.7", "tabulate>=0.9"]

[project.urls]
Homepage   = "https://github.com/Mattral/simd-ml-kernels"
Preprint   = "https://zenodo.org/records/20616502"
Issues     = "https://github.com/Mattral/simd-ml-kernels/issues"

# ─── scikit-build-core CMake settings ─────────────────────────────────────────
[tool.scikit-build]
cmake.build-type = "Release"
build.verbose    = false
# simd_ml_kernels: the package (the compiled _core module is installed into it).
# simd_kernels: deprecated import alias, kept until 0.5.0.
wheel.packages   = ["python/simd_ml_kernels", "python/simd_kernels"]
# Only install the Python extension module into the wheel. Without this,
# scikit-build-core packages everything the project's CMakeLists.txt
# install() rules touch — static lib, public headers, CMake package config,
# benchmark executables — none of which belong in a pip wheel, and (until
# this was fixed) the wheel didn't even contain the actual importable .so.
install.components = ["PythonModule"]
# A wheel needs only the extension module: skip the C++ tests (which fetch
# doctest from GitHub at configure time) and the benchmark executables.
cmake.define = { SIMD_ML_BUILD_TESTS = "OFF", SIMD_ML_BUILD_BENCHMARKS = "OFF" }

# ─── pytest configuration ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts      = "--tb=short -q"
# Mark slow tests so they can be skipped in quick CI:
#   pytest -m "not slow"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
]

# ─── Ruff linter (optional, used by guardrail.yml) ────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]   # line length handled separately

# ─── Wheels (cibuildwheel; .github/workflows/wheels.yml) ─────────────────────
# Linux x86_64 wheels contain the scalar, AVX2 and AVX-512 units and choose one
# at run time, so a wheel built on any runner runs on any x86-64 CPU. macOS
# arm64 wheels contain only the scalar kernels. Each wheel is installed in a
# clean environment and must pass selftest before it is uploaded as a CI
# artifact. Nothing is published.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 *-win32"
test-command = "python -m simd_ml_kernels selftest"
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
