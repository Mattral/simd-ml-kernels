[build-system]
requires = [
    "scikit-build-core>=0.6",
    "pybind11>=2.11",
    "cmake>=3.22",
    "ninja",
]
build-backend = "scikit_build_core.build"

# ─── Project metadata ──────────────────────────────────────────────────────────
[project]
name            = "simd-ml-microkernels"
version         = "0.2.0"
description     = "Hand-vectorized AVX2 GEMM and ML activation microkernels with Python bindings"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies    = ["numpy>=1.24"]

[project.optional-dependencies]
# Minimum set for running the full test suite
dev   = ["pytest>=7.4", "scipy>=1.11", "torch; extra == 'torch'"]
# Additional tools for the Python benchmark with plots
bench = ["matplotlib>=3.7", "tabulate>=0.9"]
# Everything including optional extras
all   = ["pytest>=7.4", "scipy>=1.11", "matplotlib>=3.7", "tabulate>=0.9"]

[project.urls]
Homepage   = "https://github.com/Mattral/SIMD-Microkernels-for-ML-Workloads"
Preprint   = "https://zenodo.org/records/20616502"
Issues     = "https://github.com/Mattral/SIMD-Microkernels-for-ML-Workloads/issues"

# ─── scikit-build-core CMake settings ─────────────────────────────────────────
[tool.scikit-build]
cmake.build-type = "Release"
build.verbose    = false
wheel.packages   = []     # C extension only — no Python package directory
# Only install the Python extension module into the wheel. Without this,
# scikit-build-core packages everything the project's CMakeLists.txt
# install() rules touch — static lib, public headers, CMake package config,
# benchmark executables — none of which belong in a pip wheel, and (until
# this was fixed) the wheel didn't even contain the actual importable .so.
install.components = ["PythonModule"]
# A wheel needs only the extension module: skip the C++ tests (which fetch
# doctest from GitHub at configure time) and the benchmark executables.
cmake.define = { SIMD_ML_BUILD_TESTS = "OFF", SIMD_ML_BUILD_BENCHMARKS = "OFF" }

# ─── pytest configuration ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts      = "--tb=short -q"
# Mark slow tests so they can be skipped in quick CI:
#   pytest -m "not slow"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
]

# ─── Ruff linter (optional, used by guardrail.yml) ────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]   # line length handled separately
