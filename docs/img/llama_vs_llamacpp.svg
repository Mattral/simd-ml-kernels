<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 585" width="960" height="585" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Llama-3.2-1B decode tokens/s, ours vs llama.cpp</title>
