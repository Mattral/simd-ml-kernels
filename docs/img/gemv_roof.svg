<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 506" width="960" height="506" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Decode GEMV, % of the measured read roof</title>
<desc id="desc">Decode GEMV as % of the measured read roof on Intel Core Ultra 5 226V, commit 42f64c7d76b3: FP32 93–96%, FP16 85–95%, BF16 82–87%, Q8_0 81–89%, Q4_0 68–83%. Not published: BF16 1×2048×8192.</desc>
<style>
  .bg { fill: #fcfcfb; stroke: #d0d7de; }
  .t1 { fill: #1f2328; }
  .t2 { fill: #57606a; }
  .grid { stroke: #d8dee4; }
  .axis { stroke: #8c959f; }
  .ref { stroke: #57606a; }
  .ours { fill: #2a78d6; }
  .base { fill: #eb6834; }
  .hatch { stroke: #fcfcfb; }
  .lose { fill: #fcfcfb; stroke: #c4432b; }
  .win { fill: #2a78d6; stroke: #fcfcfb; }
  .box { fill: #f0f3f6; stroke: #8c959f; }
  .arrow { stroke: #57606a; fill: none; }
  .head { fill: #57606a; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1d21; stroke: #3d444d; }
    .t1 { fill: #e6edf3; }
    .t2 { fill: #9da7b3; }
    .grid { stroke: #30363d; }
    .axis { stroke: #6e7781; }
    .ref { stroke: #9da7b3; }
    .ours { fill: #3987e5; }
    .base { fill: #d95926; }
    .hatch { stroke: #1a1d21; }
    .lose { fill: #1a1d21; stroke: #f0795a; }
    .win { fill: #3987e5; stroke: #1a1d21; }
    .box { fill: #22272e; stroke: #6e7781; }
    .arrow { stroke: #9da7b3; }
    .head { fill: #9da7b3; }
  }
</style>

<rect x="0.5" y="0.5" width="959" height="505" class="bg" rx="8"/>
<text x="24" y="30" class="t1" font-size="17" text-anchor="start" font-weight="600">Decode GEMV y = x·Wᵀ: % of the measured read roof, by weight type (higher is better)</text>
<text x="24" y="49" class="t2" font-size="12" text-anchor="start">Intel Core Ultra 5 226V (lnl-226v-wsl), commit 42f64c7d76b3, benchmarks/results/lnl-226v-wsl_2026-10-20_42f64c7d76b3.json</text>
<text x="24" y="68" class="t2" font-size="12" text-anchor="start">Single thread. 100% = the read roof timed in the same case; the GEMV reads every weight once, so memory bandwidth is the limit.</text>
<line x1="230" y1="88" x2="230" y2="446" class="grid"/>
<text x="230" y="462" class="t2" font-size="11" text-anchor="middle">0%</text>
<line x1="360" y1="88" x2="360" y2="446" class="grid"/>
<text x="360" y="462" class="t2" font-size="11" text-anchor="middle">20%</text>
<line x1="490" y1="88" x2="490" y2="446" class="grid"/>
<text x="490" y="462" class="t2" font-size="11" text-anchor="middle">40%</text>
<line x1="620" y1="88" x2="620" y2="446" class="grid"/>
<text x="620" y="462" class="t2" font-size="11" text-anchor="middle">60%</text>
<line x1="750" y1="88" x2="750" y2="446" class="grid"/>
<text x="750" y="462" class="t2" font-size="11" text-anchor="middle">80%</text>
<line x1="880" y1="88" x2="880" y2="446" class="axis"/>
<text x="880" y="462" class="t2" font-size="11" text-anchor="middle">100%</text>
<text x="24" y="106" class="t1" font-size="13" text-anchor="start" font-weight="600">FP32</text>
<text x="220" y="106" class="t2" font-size="12" text-anchor="end">1×2048×8192</text>
<rect x="230" y="94" width="605.8" height="14" class="ours" rx="2"/>
<text x="840.8" y="106" class="t1" font-size="11" text-anchor="start">93%</text>
<text x="24" y="126" class="t1" font-size="13" text-anchor="start" font-weight="600"></text>
<text x="220" y="126" class="t2" font-size="12" text-anchor="end">1×4096×4096</text>
<rect x="230" y="114" width="620.8" height="14" class="ours" rx="2"/>
<text x="855.8" y="126" class="t1" font-size="11" text-anchor="start">96%</text>
<text x="24" y="146" class="t1" font-size="13" text-anchor="start" font-weight="600"></text>
<text x="220" y="146" class="t2" font-size="12" text-anchor="end">1×4096×11008</text>
<rect x="230" y="134" width="625.2" height="14" class="ours" rx="2"/>
<text x="860.2" y="146" class="t1" font-size="11" text-anchor="start">96%</text>
<line x1="24" y1="157" x2="936" y2="157" class="grid"/>
<text x="24" y="178" class="t1" font-size="13" text-anchor="start" font-weight="600">FP16</text>
<text x="220" y="178" class="t2" font-size="12" text-anchor="end">1×2048×8192</text>
<rect x="230" y="166" width="557.2" height="14" class="ours" rx="2"/>
<text x="792.2" y="178" class="t1" font-size="11" text-anchor="start">86%</text>
<text x="24" y="198" class="t1" font-size="13" text-anchor="start" font-weight="600"></text>
<text x="220" y="198" class="t2" font-size="12" text-anchor="end">1×4096×4096</text>
<rect x="230" y="186" width="551.3" height="14" class="ours" rx="2"/>
<text x="786.3" y="198" class="t1" font-size="11" text-anchor="start">85%</text>
<text x="24" y="218" class="t1" font-size="13" text-anchor="start" font-weight="600"></text>
<text x="220" y="218" class="t2" font-size="12" text-anchor="end">1×4096×11008</text>
<rect x="230" y="206" width="617.1" height="14" class="ours" rx="2"/>
<text x="852.1" y="218" class="t1" font-size="11" text-anchor="start">95%</text>
<line x1="24" y1="229" x2="936" y2="229" class="grid"/>
<text x="24" y="250" class="t1" font-size="13" text-anchor="start" font-weight="600">BF16</text>
<text x="220" y="250" class="t2" font-size="12" text-anchor="end">1×2048×8192</text>
<text x="234" y="250" class="t2" font-size="11" text-anchor="start">not published: clock below 3.6 GHz in every attempt</text>
<text x="24" y="270" class="t1" font-size="13" text-anchor="start" font-weight="600"></text>
<text x="220" y="270" class="t2" font-size="12" text-anchor="end">1×4096×4096</text>
<rect x="230" y="258" width="531.2" height="14" class="ours" rx="2"/>
<text x="766.2" y="270" class="t1" font-size="11" text-anchor="start">82%</text>
<text x="24" y="290" class="t1" font-size="13" text-anchor="start" font-weight="600"></text>
<text x="220" y="290" class="t2" font-size="12" text-anchor="end">1×4096×11008</text>
<rect x="230" y="278" width="568.2" height="14" class="ours" rx="2"/>
<text x="803.2" y="290" class="t1" font-size="11" text-anchor="start">87%</text>
<line x1="24" y1="301" x2="936" y2="301" class="grid"/>
<text x="24" y="322" class="t1" font-size="13" text-anchor="start" font-weight="600">Q8_0</text>
<text x="220" y="322" class="t2" font-size="12" text-anchor="end">1×2048×8192</text>
<rect x="230" y="310" width="553.6" height="14" class="ours" rx="2"/>
<text x="788.6" y="322" class="t1" font-size="11" text-anchor="start">85%</text>
<text x="24" y="342" class="t1" font-size="13" text-anchor="start" font-weight="600"></text>
<text x="220" y="342" class="t2" font-size="12" text-anchor="end">1×4096×4096</text>
<rect x="230" y="330" width="580.9" height="14" class="ours" rx="2"/>
<text x="815.9" y="342" class="t1" font-size="11" text-anchor="start">89%</text>
<text x="24" y="362" class="t1" font-size="13" text-anchor="start" font-weight="600"></text>
<text x="220" y="362" class="t2" font-size="12" text-anchor="end">1×4096×11008</text>
<rect x="230" y="350" width="529.7" height="14" class="ours" rx="2"/>
<text x="764.7" y="362" class="t1" font-size="11" text-anchor="start">81%</text>
<line x1="24" y1="373" x2="936" y2="373" class="grid"/>
<text x="24" y="394" class="t1" font-size="13" text-anchor="start" font-weight="600">Q4_0</text>
<text x="220" y="394" class="t2" font-size="12" text-anchor="end">1×2048×8192</text>
<rect x="230" y="382" width="441.4" height="14" class="ours" rx="2"/>
<text x="676.4" y="394" class="t1" font-size="11" text-anchor="start">68%</text>
<text x="24" y="414" class="t1" font-size="13" text-anchor="start" font-weight="600"></text>
<text x="220" y="414" class="t2" font-size="12" text-anchor="end">1×4096×4096</text>
<rect x="230" y="402" width="454.1" height="14" class="ours" rx="2"/>
<text x="689.1" y="414" class="t1" font-size="11" text-anchor="start">70%</text>
<text x="24" y="434" class="t1" font-size="13" text-anchor="start" font-weight="600"></text>
<text x="220" y="434" class="t2" font-size="12" text-anchor="end">1×4096×11008</text>
<rect x="230" y="422" width="539.2" height="14" class="ours" rx="2"/>
<text x="774.2" y="434" class="t1" font-size="11" text-anchor="start">83%</text>
<text x="24" y="486" class="t2" font-size="12" text-anchor="start">M×N×K per row (one row x, W [N, K]). Bars start at zero. Q8_0 and Q4_0 are ggml's block formats (34 and 18 bytes per 32 weights).</text>
</svg>
