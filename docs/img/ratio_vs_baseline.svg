<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 769" width="960" height="769" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Speed relative to OpenBLAS or PyTorch</title>
<desc id="desc">Ours divided by the baseline per case. Intel Core Ultra 5 226V, commit 42f64c7d76b3: FP32 GEMM vs OpenBLAS 0.90–0.99×; FP16 GEMM vs PyTorch 1.40–1.51×; BF16 GEMM vs PyTorch 0.97–1.16×; INT8 GEMM vs PyTorch 1.61–2.09×; FP32 decode GEMV vs OpenBLAS 1.01–1.14×; FP32 decode GEMV vs PyTorch 1.00–1.04×; FP16/BF16 decode GEMV vs PyTorch 1.60–1.83×; GeLU (erf) vs PyTorch 1.72×; GeLU (tanh) vs PyTorch 2.88×; SiLU vs PyTorch 1.33×; ReLU vs PyTorch 0.97×; Softmax vs PyTorch 1.10×; LayerNorm vs PyTorch 0.96×. Below 1.0: FP32 GEMM N=256 0.90×, FP32 GEMM N=128 0.94×, FP32 GEMM N=2048 0.96×, FP32 GEMM N=512 0.96×, FP32 GEMM N=1024 0.99×, BF16 GEMM 1024×1024×1024 0.97×, BF16 GEMM 512×512×512 0.98×, BF16 GEMM 2048×2048×2048 0.99×, BF16 GEMM 256×256×256 0.99×, ReLU 1048576 0.97×, LayerNorm 1024×1024 0.96×. Intel Xeon Processor @ 2.10GHz, commit 255f27755c31: FP32 GEMM vs OpenBLAS 0.87–1.07×; FP16 GEMM vs PyTorch 0.57–1.25×; BF16 GEMM vs PyTorch 0.14–0.72×; INT8 GEMM vs PyTorch 0.13–2.46×; GeLU (erf) vs PyTorch 1.01×; GeLU (tanh) vs PyTorch 2.52×; SiLU vs PyTorch 1.00×; ReLU vs PyTorch 1.01×; Softmax vs PyTorch 0.86×; LayerNorm vs PyTorch 0.96×. Below 1.0: FP32 GEMM N=2048 0.87×, FP32 GEMM N=1024 0.91×, FP32 GEMM N=512 0.98×, FP32 GEMM N=256 0.99×, FP16 GEMM 1×4096×4096 0.57×, FP16 GEMM 2048×2048×2048 0.89×, FP16 GEMM 1024×1024×1024 0.89×, FP16 GEMM 512×512×512 0.90×, BF16 GEMM 1024×1024×1024 0.14×, BF16 GEMM 2048×2048×2048 0.14×, BF16 GEMM 512×512×512 0.18×, BF16 GEMM 256×256×256 0.43×, BF16 GEMM 1×4096×4096 0.58×, BF16 GEMM 128×128×128 0.72×, INT8 GEMM 1×4096×4096 0.13×, INT8 GEMM 2048×2048×2048 0.67×, INT8 GEMM 512×512×512 0.71×, INT8 GEMM 1024×1024×1024 0.75×, Softmax 1024×1024 0.86×, LayerNorm 1024×1024 0.96×.</desc>
